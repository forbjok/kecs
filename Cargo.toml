[workspace]
resolver = "2"

members = [
  "cli",
  "lib",
]

[workspace.dependencies]
anyhow = "1.0.104"
blake2 = "0.11.0"
blake3 = "1.8.7"
byteorder = "1.5.0"
clap = "4.6.9"
crc32fast = "1.5.5"
hex = "0.4.3"
indicatif = "0.18.6"
md-5 = "0.11.0"
serde = "1.0.229"
serde_derive = "1.0.229"
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
sha3 = "0.12.0"
strum = "0.28.0"
strum_macros = "0.28.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
walkdir = "2.5.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
